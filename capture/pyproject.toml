[project]
name = "phone-capture"
version = "0.1.0"
description = "Calibrated hand and bowl tracking from a single side-on phone video"
requires-python = ">=3.12,<3.13"
# Kept apart from the main project: MediaPipe's pins conflict with lerobot's. Nothing here imports lerobot.
dependencies = [
    "mediapipe==1.1.0",
    "opencv-contrib-python==5.0.0.93",
    "av==15.1.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "tyro>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
